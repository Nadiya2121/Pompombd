<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Pom Pom BD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .thumb-16-9 {
      aspect-ratio: 16 / 9;
      object-fit: cover;
      width: 100%;
    }
  </style>
</head>
<body class="bg-[#0b0b10] text-gray-200 font-sans pb-16">

  <!-- লগইন সেকশন -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#151520] border border-gray-800 p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl">
      <h2 class="text-2xl font-black text-rose-500 mb-2">Admin Login</h2>
      <p class="text-xs text-gray-400 mb-6">Pom Pom BD কন্ট্রোল প্যানেলে প্রবেশ করুন</p>
      <input id="adminPass" type="password" placeholder="অ্যাডমিন পাসওয়ার্ড দিন" class="w-full bg-[#1e1e2d] border border-gray-700 rounded-xl px-4 py-3 text-sm text-white mb-4 focus:outline-none focus:border-rose-500">
      <button onclick="loginAdmin()" class="w-full bg-gradient-to-r from-rose-500 to-pink-600 text-white font-bold py-3 rounded-xl shadow-lg">লগইন করুন</button>
    </div>
  </div>

  <!-- মূল ড্যাশবোর্ড (লগইন করার পর ওপেন হবে) -->
  <div id="dashboardSection" class="hidden max-w-5xl mx-auto p-4 sm:p-6">
    <header class="flex justify-between items-center py-4 border-b border-gray-800 mb-6">
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-rose-500">Pom Pom BD Dashboard</h1>
        <p class="text-xs text-gray-400">ভিডিও এবং ডিরেক্ট লিংক ম্যানেজার</p>
      </div>
      <button onclick="logout()" class="text-xs bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-2 rounded-xl">লগআউট</button>
    </header>

    <!-- ডিরেক্ট লিংক ম্যানেজার কার্ড -->
    <div class="bg-[#151520] border border-gray-800 p-5 rounded-2xl mb-8">
      <h3 class="font-bold text-sm text-amber-400 mb-3 flex items-center gap-2">
        <span>🔗</span> আনলিমিটেড অ্যাড ডিরেক্ট লিংক (Auto Rotation)
      </h3>
      <div class="flex gap-2 mb-4">
        <input id="newLinkInput" type="text" placeholder="https://monetag.com/direct-link-url..." class="flex-1 bg-[#1e1e2d] border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
        <button onclick="addNewLink()" class="bg-amber-500 hover:bg-amber-600 text-black font-bold text-xs px-5 py-2.5 rounded-xl">Add Link</button>
      </div>
      
      <!-- সেভ করা লিংকগুলোর লিস্ট -->
      <div id="linksList" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
    </div>

    <!-- ভিডিও ম্যানেজমেন্ট কার্ড -->
    <div>
      <h3 class="font-bold text-base text-gray-100 mb-4 flex items-center gap-2">
        <span>🎬</span> আপলোডকৃত ভিডিও সমূহ (<span id="totalVideos">0</span>)
      </h3>
      <div id="videosGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5"></div>
    </div>
  </div>

  <!-- ভিডিও এডিট পপআপ মডাল -->
  <div id="editModal" class="fixed inset-0 bg-black/85 flex items-center justify-center hidden z-50 p-4">
    <div class="bg-[#181824] border border-gray-800 w-full max-w-md rounded-3xl p-6 shadow-2xl">
      <h3 class="font-bold text-base text-rose-500 mb-4">ভিডিও ইনফরমেশন এডিট করুন</h3>
      <input type="hidden" id="editVidId">

      <label class="text-xs text-gray-400 block mb-1">ভিডিওর টাইটেল:</label>
      <input id="editTitle" class="w-full bg-[#111118] border border-gray-700 p-3 rounded-xl text-xs text-white mb-3">

      <label class="text-xs text-gray-400 block mb-1">বাটনের নাম বা পার্ট নম্বর:</label>
      <input id="editBtn" class="w-full bg-[#111118] border border-gray-700 p-3 rounded-xl text-xs text-white mb-3">

      <label class="text-xs text-gray-400 block mb-1">16:9 থাম্বনেইল ইমেজ URL:</label>
      <input id="editThumb" class="w-full bg-[#111118] border border-gray-700 p-3 rounded-xl text-xs text-white mb-5">

      <div class="flex gap-3">
        <button onclick="saveVideoEdit()" class="flex-1 bg-rose-600 hover:bg-rose-700 text-xs py-3 rounded-xl font-bold">Save Changes</button>
        <button onclick="closeEditModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-xs py-3 rounded-xl">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let authToken = localStorage.getItem('admin_pass') || '';
    let currentVideos = [];

    if (authToken) checkAuth();

    async function loginAdmin() {
      const pass = document.getElementById('adminPass').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      const data = await res.json();
      if (data.success) {
        authToken = pass;
        localStorage.setItem('admin_pass', pass);
        checkAuth();
      } else {
        alert('ভুল পাসওয়ার্ড!');
      }
    }

    function checkAuth() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      loadAdminData();
    }

    function logout() {
      localStorage.removeItem('admin_pass');
      location.reload();
    }

    async function loadAdminData() {
      loadVideos();
      loadLinks();
    }

    // ভিডিও লিস্ট লোড
    async function loadVideos() {
      const res = await fetch('/api/videos');
      currentVideos = await res.json();
      document.getElementById('totalVideos').innerText = currentVideos.length;
      const grid = document.getElementById('videosGrid');
      grid.innerHTML = '';

      currentVideos.forEach(v => {
        grid.innerHTML += `
          <div class="bg-[#151520] border border-gray-800 rounded-2xl overflow-hidden shadow-lg flex flex-col">
            <img src="${v.thumbnail}" class="thumb-16-9" />
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <h4 class="font-bold text-sm line-clamp-2 text-white mb-2">${v.title}</h4>
                <span class="inline-block bg-gray-800 text-amber-400 text-[10px] px-2 py-1 rounded-md mb-4">${v.button_text}</span>
              </div>
              <div class="flex gap-2 pt-2 border-t border-gray-800">
                <button onclick="openEditModal('${v._id}')" class="flex-1 bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs py-2 rounded-xl">Edit</button>
                <button onclick="deleteVideo('${v._id}')" class="flex-1 bg-red-600/20 text-red-400 border border-red-500/30 text-xs py-2 rounded-xl">Delete</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    // ডিরেক্ট লিংক লোড
    async function loadLinks() {
      const res = await fetch('/api/admin/links?pass=' + authToken);
      const links = await res.json();
      const list = document.getElementById('linksList');
      list.innerHTML = '';

      links.forEach(l => {
        list.innerHTML += `
          <div class="flex justify-between items-center bg-[#1e1e2d] px-3 py-2 rounded-xl text-xs">
            <span class="text-gray-300 truncate max-w-[280px]">${l.url}</span>
            <div class="flex items-center gap-3">
              <span class="text-amber-400 font-mono text-[11px]">${l.clicks || 0} clicks</span>
              <button onclick="deleteLink('${l._id}')" class="text-red-400 hover:text-red-300">✕</button>
            </div>
          </div>
        `;
      });
    }

    async function addNewLink() {
      const input = document.getElementById('newLinkInput');
      if (!input.value) return;
      await fetch('/api/admin/add-link?pass=' + authToken, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: input.value })
      });
      input.value = '';
      loadLinks();
    }

    async function deleteLink(id) {
      if (confirm('লিংকটি ডিলিট করতে চান?')) {
        await fetch('/api/admin/delete-link/' + id + '?pass=' + authToken, { method: 'DELETE' });
        loadLinks();
      }
    }

    function openEditModal(id) {
      const v = currentVideos.find(x => x._id === id);
      if (!v) return;
      document.getElementById('editVidId').value = v._id;
      document.getElementById('editTitle').value = v.title;
      document.getElementById('editBtn').value = v.button_text;
      document.getElementById('editThumb').value = v.thumbnail;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function saveVideoEdit() {
      const id = document.getElementById('editVidId').value;
      const title = document.getElementById('editTitle').value;
      const button_text = document.getElementById('editBtn').value;
      const thumbnail = document.getElementById('editThumb').value;

      await fetch('/api/admin/edit-video?pass=' + authToken, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, title, button_text, thumbnail })
      });

      closeEditModal();
      loadVideos();
    }

    async function deleteVideo(id) {
      if (confirm('আপনি কি নিশ্চিত এই ভিডিওটি ডিলিট করবেন?')) {
        await fetch('/api/admin/delete-video/' + id + '?pass=' + authToken, { method: 'DELETE' });
        loadVideos();
      }
    }
  </script>
</body>
</html>
